services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siwes_companion}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - siwes-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-siwes_companion}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrator:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-siwes_companion}
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-siwes_companion}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

  # Optional: Cloudflare Zero Trust Tunnel daemon
  # Run alongside app with: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - app
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  # Optional: Long-polling Telegram bot (if not using Telegram webhook)
  # Run alongside app with: docker compose --profile bot-polling up -d
  bot-polling:
    build:
      context: .
      target: builder
    restart: unless-stopped
    profiles: ["bot-polling"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-siwes_companion}
    command: ["npx", "tsx", "src/adapters/telegram/polling.ts"]

volumes:
  siwes-postgres:
