services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siwes_companion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - siwes-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siwes_companion"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/siwes_companion
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

  migrator:
    build:
      context: .
      target: builder
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/siwes_companion
    command: ["npx", "prisma", "migrate", "deploy"]

volumes:
  siwes-postgres:
